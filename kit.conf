# kit.conf - the look every machine gets
# Edit, commit, push. On each machine: git pull && ./install-ui.sh
#
# Everything here uses packaged, maintained components:
#   Orchis themes (orchis-gtk-theme, Ubuntu repositories; includes xfwm4)
#   Papirus icons (papirus-icon-theme, Ubuntu repositories)
# The taskbar layout uses only XFCE's built-in panel plugins.

# Packages to install
PACKAGES="papirus-icon-theme orchis-gtk-theme"

# --- Themes ----------------------------------------------------------------
# Names as shown in Settings -> Appearance / Window Manager.
# Orchis accent colors: Orchis (blue), Orchis-Teal, -Green, -Grey, -Orange,
# -Pink, -Purple, -Red, -Yellow; add -Compact for tighter spacing,
# e.g. Orchis-Teal-Light / Orchis-Teal-Dark.
# Previous look (preinstalled on Mint): Mint-Y-Aqua / Mint-Y-Dark-Aqua, WM Mint-Y / Mint-Y-Dark
LIGHT_GTK=Orchis-Light
DARK_GTK=Orchis-Dark
LIGHT_WM=Orchis-Light
DARK_WM=Orchis-Dark
LIGHT_ICONS=Papirus
DARK_ICONS=Papirus-Dark

# light | dark | auto (switch at sunrise/sunset)
THEME_MODE=auto
LATITUDE=42.53N
LONGITUDE=83.78W

# --- Taskbar layout ----------------------------------------------------------
# topbar-dock : slim top bar (menu, tray, sound, notifications, clock) plus a
#               centered dock at the bottom (pinned apps + open windows)
# keep        : leave the panel as it is (Mint's default bottom panel)
# An exported bundle's panel always wins over this; use --layout to override.
PANEL_LAYOUT=topbar-dock
TOPBAR_SIZE=28
TOPBAR_ICON_SIZE=16          # tray + status icons in the top bar (all the same size)
# Dock: plank - Plank dock: right-click an open app -> "Keep in Dock" to pin
#                it, drag an icon off to unpin (solid light/dark background)
#       panel - XFCE panel dock (pinned launchers + window buttons)
DOCK_STYLE=plank
DOCK_SIZE=48
DOCK_AUTOHIDE=intelligent     # never | intelligent (hide when a window covers it) | always
DOCK_AUTOHIDE_REMOTE=never    # same choices, used instead over remote desktop (xrdp);
                              # empty = same as DOCK_AUTOHIDE
# Pinned dock apps (desktop file names); ones that aren't installed are skipped.
# Rebuilding the layout (--layout) resets the dock to this list.
DOCK_APPS="firefox thunar xfce4-terminal mintinstall xfce-settings-manager"
CLOCK_FORMAT="%a %b %-d  %-I:%M %p"
